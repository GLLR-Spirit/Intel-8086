name: Niveau 3 — audit navigateur
on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "tests/level3-browser-audit.cjs"
      - "tests/xlat-interactive-8086.cjs"
      - "tests/xchg-interactive-8086.cjs"
      - "tests/lea-interactive-8086.cjs"
      - "tests/lds-les-interactive-8086.cjs"
      - "tests/call-ret-interactive-8086.cjs"
      - "tests/call-indirect-interactive-8086.cjs"
      - ".github/workflows/level3-browser-audit.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Démarrer le serveur statique
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/8086-server.log 2>&1 &
          echo $! > /tmp/8086-server.pid
      - name: Exécuter les auto-tests, 18 exemples et 16 conditions Jcc
        run: node tests/level3-browser-audit.cjs
      - name: Vérifier XLAT via le vrai bouton Pas à pas
        run: node tests/xlat-interactive-8086.cjs
      - name: Vérifier XCHG via le vrai bouton Pas à pas
        run: node tests/xchg-interactive-8086.cjs
      - name: Vérifier LEA via le vrai bouton Pas à pas
        run: node tests/lea-interactive-8086.cjs
      - name: Vérifier LDS et LES via le vrai bouton Pas à pas
        run: node tests/lds-les-interactive-8086.cjs
      - name: Vérifier CALL FAR et RETF via le vrai bouton Pas à pas
        run: node tests/call-ret-interactive-8086.cjs
      - name: Vérifier CALL indirect near/far via Pas à pas et exécution binaire
        run: node tests/call-indirect-interactive-8086.cjs
